---
name: Release
# Versions the template itself. release-please opens and maintains a release PR
# from the Conventional Commits that land on `main`; on merge it tags the commit
# (v0.1.0, ...) and cuts a GitHub Release. Those tags are what a generated
# bucket's `copier update` walks to. There are no build or publish jobs because
# the template is not a distributable package. Never remove `workflow_dispatch`:
# it is the manual way to re-run the release after a failure.
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions: {}
jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write  # release-please manages PR labels through the Issues API
      pull-requests: write
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
